<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例3</title>
    <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4090357_z2qpnic06um.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        a {
            text-decoration: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #303640;
        }
        .menu {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            transition: all .5s;
        }
        .btn {
            position: absolute;
            z-index: 1;
            width: 60px;
            height: 60px;
            background-color: #303640;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all .5s;
        }
        .btn i {
            font-size: 32px;
        }
        .menu span {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            position: absolute;
            border-radius: 50%;
            color: var(--clr);
            border: 2px solid var(--clr);
            background-color: #303640;
            z-index: 0;
            transition: all .5s;
        }
        .menu span i {
            color: var(--clr);
            transition: 0s;
        }
        .menu:hover .btn {
            transform: rotate(315deg);
        }
        .menu:hover span {
            transform: rotate(calc(360deg / 8 * var(--i))) translateX(80px);
        }
        .menu:hover span i {
            transform: rotate(calc(-360deg / 8 * var(--i)));
        }
        /* 鼠标经过span 会有一个漂亮的阴影效果 */
        .menu span:hover {
            box-shadow:
            0 0 10px var(--clr),
            0 0 30px var(--clr),
            0 0 50px var(--clr);
            background-color: var(--clr);
            /* 想要阴影立马显示，所以去掉过渡 */
            transition: all 0s;
        }
        .menu span:hover i {
            color: rgb(0, 0, 0);
        }
    </style>

</head>
<body>
     <div class="menu">
        <div class="btn">
            <i class="iconfont icon-add"></i>
        </div>
            <span style="--i:0;--clr: #ff2972;">
                
                    <i class="iconfont icon-home"></i>
              
            </span>
            <span style="--i:1;--clr: #fee800;">
                
                    <i class="iconfont icon-more"></i>
              
            </span>
            <span style="--i:2;--clr: #04fc43;">
                
                    <i class="iconfont icon-gift"></i>
              
            </span>
            <span style="--i:3;--clr: #fe00f1;">
                
                    <i class="iconfont icon-setting"></i>
              
            </span>
            <span style="--i:4;--clr: #00b0fe;">
                
                    <i class="iconfont icon-message"></i>
              
            </span>
            <span style="--i:5;--clr: #fea600;">
                
                    <i class="iconfont icon-cart"></i>

            </span>
            <span style="--i:6;--clr: #a529ff;">
                
                    <i class="iconfont icon-money"></i>
              
            </span>
            <span style="--i:7;--clr: #01bdab;">
                
                    <i class="iconfont icon-star"></i>
              
            </span>
    </div>
</body>
</html>
