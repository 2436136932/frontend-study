<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <!-- 先引入网页图标 -->
     <link rel="icon" href="./favicon.ico">
     <!-- 引入iconfont图标 -->
     <link rel="stylesheet" href="./iconfont/iconfont.css">
     <!-- 引入css文件 -->
     <link rel="stylesheet" href="./css/base.css">
     <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <!-- nav bar盒子制作 -->
  <div class="nav-bar">
    <div class="back">
      <a href="index.html">
        <i class="iconfont icon-zuojiantou"></i>
      </a>
    </div>
    <a href="#" class="register">注册</a>
  </div>

  <!-- 登录头部模块 -->
  <div class="login-header">
    <h1>密码登录</h1>
    <a href="#">手机验证码登录<i class="iconfont icon-youjiantou"></i></a>
  </div>

  <!-- 登录表单模块 -->
   <form action="" class="login-form">
    <div class="row">
      <!-- tel 在移动端是数字键盘 -->
      <input type="tel" placeholder="请输入手机号" maxlength="11" minlength="11">
    </div>
    <div class="row password">
      <input type="password" placeholder="请输入密码">
      <img src="./img/eye-off.svg" alt="">
    </div>
    <div class="row agree">
      <label class="container">
  <input type="checkbox">
  <svg viewBox="0 0 64 64">
    <path d="M 0 16 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 16 L 32 48 L 64 16 V 8 A 8 8 90 0 0 56 0 H 8 A 8 8 90 0 0 0 8 V 56 A 8 8 90 0 0 8 64 H 56 A 8 8 90 0 0 64 56 V 16" pathLength="575.0541381835938" class="path"></path>
  </svg>
        </label> 
        <div class="agree-text">
            我已同意 <a href="#">用户协议</a> 及 <a href="#">隐私协议</a>
        </div>
    </div>
        <button class="login-btn">登录</button>
        <p class="forget"><a href="#">忘记密码？</a></p>
   </form>

    <!-- 第三方登录模块 -->
  <div class="third-login">
    <p>
      <span>第三方登录</span>
    </p>
    <a href="#"> <img src="./img/qq.svg" alt=""></a>
  </div>

    <script src="./js/flexible.js"></script>
</body>
</html>
