<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>综合案例1</title>
    <style>
        h2 {
            text-align: center;
        }

        table {
            border-collapse: collapse;
            margin: 0 auto;
        }

        th,
        td {
            display: inline-block;
            height: 30px;
            width: 80px;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <h2>订单</h2>
    

    <script>
        let goodsName = prompt('请输入商品名称')
        let price = Number(prompt('请输入单价'))
        let num = Number(prompt('请输入数量'))
        let address = prompt('请输入配送地址')
        document.write(`
        <table>
        <tr>
            <th>商品名称</th>
            <th>单价/元</th>
            <th>数量</th>
            <th>金额/元</th>
            <th>配送地址</th>
        </tr>
        <tr>
            <td>${goodsName}</td>
            <td>${price}</td>
            <td>${num}</td>
            <td>${price * num}</td>
            <td>${address}</td>
        </tr>
    </table>
        `)
    </script>
</body>

</html>
