<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箭头函数的this</title>
</head>
<body>
    <script>
        const fn = () => {
            console.log(this);
        }
        fn()

        const obj1 = {
            name: '张三',
            age: 18,
            sex: '男',
            fn: () => {
                console.log(this);
            }
        }
        obj1.fn()
    </script>
    
</body>
</html>
