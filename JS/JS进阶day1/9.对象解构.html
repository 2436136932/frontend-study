<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对象解构学习</title>
</head>
<body>
    <script>
        // ========== 1. 基本对象解构 ==========
        const user = { name: '张三', age: 20, city: '北京' };
        const { name, age, city } = user;
        console.log(name, age, city);
        // 输出：张三 20 北京

        // ========== 2. 重命名变量 ==========
        const { name: userName, age: userAge } = user;
        console.log(userName, userAge);
        // 输出：张三 20

        // ========== 3. 默认值 ==========
        const { text = '未设置' } = user;
        console.log(text);
        // 输出：未设置

        // ========== 4. 剩余属性 ==========
        const { name: title, ...others } = user;
        console.log(title, others);
        // 输出：张三 {age: 20, city: '北京'}

        // ========== 5. 嵌套对象解构 ==========
        const student = {
            info: { grade: '大三', major: '计算机' },
            score: 95
        };
        const { info: { grade, major }, score } = student;
        console.log(grade, major, score);
        // 输出：大三 计算机 95

        // ========== 6. 函数参数解构 ==========
        function printUser({ name, age, city = '未知' }) {
            console.log(`${name} ${age}岁 来自${city}`);
        }
        printUser({ name: '李四', age: 22 });
        // 输出：李四 22岁 来自未知

        // ========== 7. 数组对象解构 ==========
        const pig = [
            { id: 1, name: '小猪', age: 1 },
            { id: 2, name: '大猪', age: 2 },
            { id: 3, name: '二猪', age: 3 },
            { id: 4, name: '三猪', age: 4 },
            { id: 5, name: '四猪', age: 5 }
        ];
        const [first, second, ...rest] = pig;
        console.log(first, second, rest);
        // 输出：{id: 1, name: '小猪', age: 1} {id: 2, name: '大猪', age: 2} [{id: 3, name: '二猪', age: 3}, {id: 4, name: '三猪', age: 4}, {id: 5}]

        // ========== 8. 多级对象解构（3层以上嵌套） ==========
        const school = {
            name: '第一中学',
            address: {
                city: '广州',
                district: '天河区',
                detail: {
                    street: '中山大道',
                    number: '88号',
                    zip: '510000'
                }
            },
            principal: {
                name: '王校长',
                contact: {
                    phone: '13800138000',
                    email: 'wang@school.com'
                }
            }
        };
        const {
            name: schoolName,
            address: {
                city: schoolCity,
                detail: { street, number, zip: zipCode }
            },
            principal: {
                name: principalName,
                contact: { phone, email }
            }
        } = school;
        console.log(schoolName, schoolCity, street, number, zipCode);
        // 输出：第一中学 广州 中山大道 88号 510000
        console.log(principalName, phone, email);
        // 输出：王校长 13800138000 wang@school.com

        // ========== 9. 提取 API 数据 ==========
        const response = {
            code: 200,
            data: { id: 1001, username: 'admin' },
            message: '成功'
        };
         const { data: { id, username }, message: msg } = response;
        console.log(id, username, msg);
        // 输出：1001 admin 成功
    </script>
</body>
</html>
