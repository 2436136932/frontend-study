<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浅拷贝</title>
</head>
<body>
    <script>
        const obj = {
            name:'张三',
            age:18,
            sex:'男',
            family: {
                baby:'baby'
            }
        }
        // 浅拷贝方法1：对象展开运算符
        const o = {...obj}
        console.log(o);
        o.name = '李四'
        o.age = 20
        o.sex = '女'
        o.family.baby = '李四'//浅拷贝不会影响原对象的子对象
        console.log(o);
        console.log(obj);
        console.log(o.family);
        console.log(obj.family);
        console.log(o === obj);

        console.log('=============================================');

        // 浅拷贝方法2：Object.assign()
        const o2 = {}
        Object.assign(o2,obj)
        console.log(o2);
        o2.name = '王五'
        o2.age = 22
        o2.sex = '男'
        console.log(o2);
        console.log(obj);
        console.log(o2 === obj);
    </script>
</body>
</html>
