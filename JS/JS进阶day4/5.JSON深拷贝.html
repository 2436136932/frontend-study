<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON深拷贝</title>
</head>
<body>
    <script>
        const obj = {
            name:'张三',
            age:18,
            sex:'男',
            family: {
                baby:'baby'
            }
        }
        // 深拷贝方法1：JSON.parse(JSON.stringify())
        const o = JSON.parse(JSON.stringify(obj))
        o.name = '李四'
        o.age = 20
        o.sex = '女'
        o.family.baby = '李四'
        console.log('新对象：',o);
        console.log('原对象：',obj);
        console.log('新对象是否等于原对象：',o === obj);
    </script>
</body>
</html>
