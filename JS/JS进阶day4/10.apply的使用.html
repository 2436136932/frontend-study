<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apply的使用</title>
</head>

<body>

    <script>
        const obj = {
            age: 18
        }

        function fn(x, y) {
            console.log(this) // {age:18}
            console.log(x + y)
        }

        //1. 调用函数
        //2. 改变this指向
        fn.apply(obj, [1, 2])
        //3. 返回值 本身就是在调用函数，所以返回值就是函数的返回值

        //使用场景，求最值
        const arr = [1, 2, 3, 4, 5]
        const max = Math.max.apply(Math, arr)
        const min = Math.min.apply(null, arr)
        console.log(max,min)
        
        //使用扩展运算符
        console.log(Math.max(...arr))
    </script>
</body>

</html>
