<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能优化之节流</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: pink;
            text-align: center;
            line-height: 300px;
            font-size: 40px;
            margin: 100px auto;
            user-select: none;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
    <script>
        const box = document.querySelector('.box')
        let i = 1
        function mouseMove() {
            box.innerHTML = i++
        }

        //方式1：使用 lodash 的节流函数
        box.addEventListener('mousemove', _.throttle(mouseMove,1000))
