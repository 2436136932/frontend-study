<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节流综合案例</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f7f8fc, #eef2ff);
            font-family: Arial, Helvetica, sans-serif;
            color: #333;
        }

        .wrap {
            width: 980px;
            max-width: calc(100vw -48px);
            display: grid;
            grid-template-columns: 1.2fr0.8fr;
            gap: 24px;
            padding: 24px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 020px60px rgba(58, 77, 140, 0.12);
            backdrop-filter: blur(10px);
        }

        .video-panel,
        .info-panel {
            border-radius: 20px;
            overflow: hidden;
            background: #fff;
            box-shadow: 010px30px rgba(15, 23, 42, 0.08);
        }

        .video-panel {
            position: relative;
            min-height: 560px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #858b97, #8996a8);
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 528px;
            display: block;
            border-radius: 16px;
            background: #000;
            object-fit: cover;
            outline: none;
        }

        .badge {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            font-size: 14px;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
        }

        .info-panel {
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-panel h1 {
            font-size: 28px;
            line-height: 1.2;
            margin-bottom: 14px;
            color: #111827;
        }

        .info-panel p {
            font-size: 15px;
            line-height: 1.9;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .tips {
            padding: 18px20px;
            border-radius: 16px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
        }

        .tips h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #111827;
        }

        .tips li {
            list-style: none;
            position: relative;
            padding-left: 18px;
            margin-bottom: 8px;
            color: #4b5563;
            font-size: 14px;
            line-height: 1.7;
        }

        .tips li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
        }

        @media (max-width:900px) {
            .wrap {
                grid-template-columns: 1fr;
            }

            .video-panel {
                min-height: 420px;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="video-panel">
            <div class="badge">节流综合案例</div>
            <video src="xiaomi.mp4" controls muted></video>
        </div>
        <div class="info-panel">
            <h1>视频节流演示</h1>
            <p>这里已经把页面样式搭好了，你可以直接在这个页面里写视频相关的节流 JS逻辑。</p>
            <div class="tips">
                <h2>你接下来可以写的内容</h2>
                <ul>
                    <li>监听视频播放进度变化</li>
                    <li>对高频触发事件做节流处理</li>
                    <li>更新页面中的时间、进度或状态</li>
                    <li>根据你的课堂截图补充交互效果</li>
                </ul>
            </div>
        </div>
    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
<script>
    const video = document.querySelector('video')
    
    video.ontimeupdate = _.throttle(() => {
        localStorage.setItem('currentTime', video.currentTime)
    }, 1000)
    video.onloadeddata = () => {
        video.currentTime = localStorage.getItem('currentTime') || 0
    }
</script>

</html>
