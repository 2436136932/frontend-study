<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>try-catch捕获异常</title>
</head>
<body>
    <h1>try-catch捕获异常</h1>
    <script>
        function fn() {
            try {
                // 可能会发生错误的代码，要写到 try 里面
                const h1 = document.querySelector('.h1')
                h1.style.color = 'red'
            } catch (err) {
                // 拦截错误，提示浏览器提供的错误信息，但是不中断程序的执行
                console.log(err.message)
                throw new Error('你看看，选择器错误了吧')
                // 需要加 return 中断程序
                // return
            } finally {
                // 不管代码程序对不对，一定会执行的代码
                alert('弹出对话框')
            }
            console.log(11)
        }
        fn()
    </script>
</body>
</html>
