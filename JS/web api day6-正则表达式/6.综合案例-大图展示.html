<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放大镜效果 - 新手教学版</title>

    <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  在开始之前，先了解两个前置概念：                              ║
    ║                                                              ║
    ║  1. CSS 定位（position）                                      ║
    ║     - relative（相对定位）：元素仍占位置，但它的子元素如果      ║
    ║       设置了 absolute，就以它为参照物来移动                    ║
    ║     - absolute（绝对定位）：元素脱离文档流，相对于最近设置了     ║
    ║       relative 的父元素定位                                   ║
    ║                                                              ║
    ║  2. CSS overflow: hidden                                     ║
    ║     超出父容器边界的内容会被裁剪掉，就像一扇窗户                ║
    ║     只能看到窗户范围内的景色                                   ║
    ╚══════════════════════════════════════════════════════════════╝
    -->

    <style>
        /* ================================================================
           第一步：认识每个 CSS 属性，一个都不能跳过！
           ================================================================ */

        /* ── 全局重置：消除浏览器默认的边距 ── */
        * {
            margin: 0;          /* 清除外边距 */
            padding: 0;         /* 清除内边距 */
            box-sizing: border-box;  /* 宽高包含 border 和 padding，更容易计算 */
        }

        /* ── body：让页面内容居中 ── */
        body {
            display: flex;              /* 开启 flex 布局（弹性盒子） */
            justify-content: center;    /* 水平居中 */
            align-items: center;        /* 垂直居中 */
            min-height: 100vh;          /* 最小高度 = 整个浏览器窗口的高度 */
            background-color: #f5f5f5;  /* 浅灰色背景 */
        }

        /* ── container：一个白色卡片，把左右两部分包起来 ── */
        .container {
            display: flex;          /* 让子元素（左侧、右侧）横向排列 */
            gap: 20px;              /* 子元素之间的间距为 20px */
            background: #fff;       /* 白色背景 */
            padding: 30px;          /* 内边距 30px */
            border-radius: 8px;     /* 圆角 8px */
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);  /* 阴影：x偏移 y偏移 模糊 颜色 */
        }


        /* ================================================================
           第二步：左侧小图区域（核心！很多概念在这里）
           ================================================================ */

        .small-box {
            /* ── 这句非常关键！ ── */
            position: relative;
            /* 含义：我本身不动，但我的子元素（mask）如果设置了 absolute，
               就以我的左上角作为 (0,0) 点来移动 */
            width: 400px;
            height: 400px;
            border: 1px solid #eee;     /* 淡淡的边框 */
            cursor: crosshair;          /* 鼠标放上来变成十字，暗示"可以放大" */
        }

        /* 左侧显示的图片：让它填满整个 small-box */
        .small-box img {
            width: 100%;    /* 宽度 = 父容器的 100%，即 400px */
            height: 100%;   /* 高度 = 父容器的 100%，即 400px */
            object-fit: cover;
            /* object-fit: cover 的作用：
               如果图片比例不对，裁剪多余部分而不是拉伸变形 */
        }


        /* ================================================================
           第三步：遮罩层（黄色半透明方块，起"放大镜框"的作用）
           ================================================================ */

        .mask {
            /* ── 绝对定位！相对于设置了 relative 的父元素（small-box）定位 ── */
            position: absolute;
            top: 0;     /* 初始位置：父元素的左上角 */
            left: 0;

            /* 尺寸是 small-box 的一半 → 放大倍数是 2 倍 */
            /* 如果用 100×100 → 放大 4 倍 */
            /* 如果用 400×400 → 放大 1 倍（没放大） */
            width: 200px;
            height: 200px;

            /* 颜色：黄色，最后一个数字是透明度（0-1），0.2 表示 20% 不透明 */
            background-color: rgba(255, 255, 0, 0.2);

            border: 1px solid #ccc;

            /* 默认隐藏，等鼠标移入时才显示 */
            display: none;

            /* 直译 ：指针事件 → 无（不接收任何鼠标/触摸事件） */
            /* 通俗理解 ：让这个元素对鼠标 "透明" ——鼠标可以穿过它，点到它下面的元素。 */
            pointer-events: none
        }


        /* ================================================================
           第四步：右侧大图区域（"放大镜"的核心效果在这里实现）
           ================================================================ */

        .big-box {
            position: relative;     /* 让大图可以相对于这个大图框移动 */
            width: 400px;           /* 大图框尺寸 = 小图框尺寸 */
            height: 400px;
            border: 1px solid #eee;

            /* ── 这个属性是放大镜效果的核心！ ── */
            overflow: hidden;
            /* 含义：超出 400×400 范围的内容全部裁掉不显示
               类比：大图框是一扇 400×400 的窗户，
               窗外有一张 800×800 的画，只能看到窗户里的部分 */

            display: none;  /* 默认隐藏 */
        }

        .big-box img {
            position: absolute;
            /* 绝对定位后，可以用 left/top 来移动图片位置 */
            top: 0;
            left: 0;

            /* 大图尺寸是小图的 2 倍 → 看到的就是 2 倍放大的效果 */
            width: 800px;
            height: 800px;
        }
    </style>
</head>
<body>

    <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  HTML 结构（DOM 树）：                                        ║
    ║                                                              ║
    ║  <div class="container">                                     ║
    ║    ├── <div class="small-box">     ← 左侧 400×400            ║
    ║    │     ├── <img>                 ← 小图                    ║
    ║    │     └── <div class="mask">    ← 遮罩层（放大镜框）       ║
    ║    └── <div class="big-box">       ← 右侧 400×400（带窗户）   ║
    ║          └── <img>                 ← 大图 800×800             ║
    ║                                                              ║
    ║  mask 的爸爸是 small-box（relative），所以 mask 的 left/top   ║
    ║  都是相对于 small-box 左上角来计算的                          ║
    ╚══════════════════════════════════════════════════════════════╝
    -->

    <div class="container">
        <!-- 左侧：小图 + 遮罩层 -->
        <div class="small-box">
            <img src="../16-小兔鲜首页项目/images/wx.png" alt="小图">
            <div class="mask"></div>
        </div>
        <!-- 右侧：大图框（窗户） + 大图 -->
        <div class="big-box">
            <img src="../16-小兔鲜首页项目/images/wx.png" alt="大图">
        </div>
    </div>

    <script>
        /*
        ╔══════════════════════════════════════════════════════════════╗
        ║  JavaScript 部分 - 放大镜的核心逻辑                          ║
        ╚══════════════════════════════════════════════════════════════╝

        先搞清楚我们要完成什么目标：

           你在淘宝/京东看商品图片时：
           - 鼠标放在左侧小图上 → 右侧出现一个放大的图片
           - 鼠标移动 → 黄色方块跟着鼠标走 → 右侧大图也跟着移动
           - 鼠标移开 → 一切消失

        背后的数学原理：比例映射

           遮罩层在小图上移动了 50% → 大图也在大图框内移动 50%

           公式：
                    遮罩层当前位置         大图偏移量
                  ───────────────  =  ───────────────
                   遮罩层最大可移动        大图最大可移动
        */

        // ============================================================
        // 第 0 步：获取页面上的元素（相当于给元素起个 JS 变量名）
        // ============================================================

        // document.querySelector() 的作用：
        // 在页面中按 CSS 选择器找一个元素，找到了就返回这个元素对象
        // 类似于：在教室里喊一声 "叫张三的同学"，张三就站起来了

        const smallBox = document.querySelector('.small-box')
        // smallBox 现在就是左侧那个 400×400 的 div

        const mask = document.querySelector('.mask')
        // mask 就是那个黄色半透明的方块

        const bigBox = document.querySelector('.big-box')
        // bigBox 就是右侧那个 400×400 的"窗户"

        const bigImg = document.querySelector('.big-box img')
        // bigImg 就是窗户里面那张 800×800 的大图
        // 这里用 document 从整个页面查找，选择器写的是 .big-box img
        // 也可以写成 bigBox.querySelector('img') —— 意思是从 bigBox 内部找 img


        // ============================================================
        // 第 1 步：鼠标移入事件（mouseenter）
        // ============================================================
        //
        // 什么时候触发？ 鼠标从外面进入 small-box 区域的那一刻
        // 要做什么？     把遮罩层和大图框显示出来

        smallBox.addEventListener('mouseenter', function () {
            /* addEventListener 是什么？
               可以理解为"监听器"或"事件绑定"
               翻译成人话：smallBox 这个元素，我命令你——
               只要发生了 'mouseenter' 事件，就执行 function 里面的代码 */

            mask.style.display = 'block'
            // 把遮罩层的 display 从 none 改成 block → 黄色方块出现了！
            // 回忆 CSS：display: none 是隐藏，display: block 是显示

            bigBox.style.display = 'block'
            // 同理，右侧大图框也显示出来
        })


        // ============================================================
        // 第 2 步：鼠标移出事件（mouseleave）
        // ============================================================
        //
        // 什么时候触发？ 鼠标从 small-box 内部移出去的那一刻
        // 要做什么？     把遮罩层和大图框隐藏掉

        smallBox.addEventListener('mouseleave', function () {
            mask.style.display = 'none'
            bigBox.style.display = 'none'
        })


        // ============================================================
        // 第 3 步：鼠标移动事件（mousemove）—— 整个案例的核心！
        // ============================================================
        //
        // 什么时候触发？ 鼠标在 small-box 内部每移动一个像素，就触发一次
        // 要做什么？     1. 让遮罩层跟着鼠标走
        //               2. 根据遮罩层的位置，同步移动右侧大图
        //
        // 参数 e 是什么？
        //   e 是"事件对象"（Event Object），浏览器自动传给你的
        //   它包含了这次鼠标事件的所有信息：
        //   - e.pageX：鼠标距离页面最左边有多少像素
        //   - e.pageY：鼠标距离页面最上边有多少像素
        //   - e.target：事件发生在哪个元素上

        smallBox.addEventListener('mousemove', function (e) {

            // ──────────────────────────────────────────────
            //  第 3.1 节：计算遮罩层应该放在什么位置
            // ──────────────────────────────────────────────
            //
            // 目标：遮罩层的中心点对准鼠标位置
            //
            //   e.pageX = 鼠标到页面最左边的距离
            //
            //   ┌────── 页面 ──────────────────────────┐
            //   │                                        │
            //   │  ┌── small-box ────┐                  │
            //   │  │                  │                  │
            //   │  │  ● ← 鼠标        │ ← small-box      │
            //   │  │                  │    offsetLeft     │
            //   │  └─────────────────┘    (这个距离)      │
            //   │                                        │
            //   │←─── e.pageX ────────→│                 │
            //   └────────────────────────────────────────┘
            //
            //   鼠标在 small-box 内的 X 坐标 = e.pageX - small-box 到页面左边的距离
            //
            //   再减去 mask 宽度的一半 → 让鼠标在遮罩层正中心

            let x = e.pageX - smallBox.offsetLeft - mask.offsetWidth / 2
            let y = e.pageY - smallBox.offsetTop - mask.offsetHeight / 2

            /* offsetLeft 是什么意思？
               它表示"这个元素离它最近的、有定位的父元素左边缘的距离"
               在这个案例中，smallBox 的 offsetLeft 就是 smallBox 到页面左边缘的距离

               offsetWidth 是什么意思？
               它表示"这个元素的可见宽度"（包括 padding + border）
               对于 mask 来说 = 200 */


            // ──────────────────────────────────────────────
            //  第 3.2 节：边界限制（不让遮罩层跑出 smallBox）
            // ──────────────────────────────────────────────
            //
            // 如果不限制，会怎样？
            // 鼠标移到图片边缘时，遮罩层会有一半跑到图片外面去
            // 我们要的是：遮罩层永远完全在 smallBox 内部
            //
            // 遮罩层能移动的最大距离 = smallBox 的尺寸 - mask 的尺寸
            // X方向：400 - 200 = 200
            // Y方向：400 - 200 = 200

            const maxX = smallBox.offsetWidth - mask.offsetWidth   // = 200
            const maxY = smallBox.offsetHeight - mask.offsetHeight // = 200

            // 把 x 限制在 [0, maxX] 的范围内
            if (x < 0) x = 0                  // 不能小于 0
            if (y < 0) y = 0                  // 不能小于 0
            if (x > maxX) x = maxX           // 不能大于 200
            if (y > maxY) y = maxY           // 不能大于 200

            // 把计算结果真正应用到遮罩层上
            mask.style.left = x + 'px'
            mask.style.top = y + 'px'
            // 注意：'px' 不能少！CSS 需要单位


            // ──────────────────────────────────────────────
            //  第 3.3 节：按比例计算大图应该偏移多少
            // ──────────────────────────────────────────────
            //
            // 这是整个案例最核心的数学！
            //
            // 思考过程（用 X 方向举例）：
            //
            //   遮罩层在小图上可以移动的范围：0px ~ 200px
            //   大图在大图框内可以移动的范围：0px ~ 400px
            //      （因为大图 800px - 大图框 400px = 400px）
            //
            //   当遮罩层在 x=100 时，它走了总路程的 100/200 = 50%
            //   那么大图也应该走总路程的 50%：400 × 50% = 200px
            //
            //   用公式表达：
            //     bigX = (x / maxX) * bigMaxX
            //          = (100 / 200) * 400
            //          = 0.5 * 400
            //          = 200
            //
            //   换个例子，遮罩层在 x=50：
            //     bigX = (50 / 200) * 400 = 0.25 * 400 = 100
            //
            //   再换个例子，遮罩层在 x=200（最右边）：
            //     bigX = (200 / 200) * 400 = 1 * 400 = 400

            const bigMaxX = bigImg.offsetWidth - bigBox.offsetWidth
            // 大图 800 - 大图框 400 = 400（大图在 X 方向能移动的最大距离）

            const bigMaxY = bigImg.offsetHeight - bigBox.offsetHeight
            // 大图 800 - 大图框 400 = 400（大图在 Y 方向能移动的最大距离）

            const bigX = (x / maxX) * bigMaxX
            const bigY = (y / maxY) * bigMaxY


            // ──────────────────────────────────────────────
            //  第 3.4 节：大图反向移动（为什么要加负号？）
            // ──────────────────────────────────────────────
            //
            // 这是最容易搞混的地方！
            //
            // 情景模拟：
            //  遮罩层在小图上向右移动 → 说明你想看图片右边的内容
            //  为了让你看到右边 → 大图应该向左移动
            //  因为大图向左移，大图的右边部分就进入了大图框（窗户）的视野
            //
            // 用窗户来类比：
            //
            //  ┌────── 大图框（窗户）──┐
            //  │  ┌──────────────┐     │
            //  │  │  大图向左移动→│ ← 大图向左移
            //  │  │  右边内容就   │     │
            //  │  │  进入窗户了！ │     │
            //  │  └──────────────┘     │
            //  └──────────────────────┘
            //
            // 所以：遮罩层向右（正数）→ 大图向左（负数）
            //      遮罩层向下（正数）→ 大图向上（负数）

            bigImg.style.left = -bigX + 'px'
            bigImg.style.top = -bigY + 'px'

            // 举例：bigX = 200 → left = -200px
            // 大图从原始位置向左移动 200px
            // 显示的是大图中间偏右的区域
        })

        /*
        ╔══════════════════════════════════════════════════════════════╗
        ║  总结：放大镜效果的三个关键                                   ║
        ║                                                              ║
        ║  1. CSS 布局                                                 ║
        ║     mask 是 absolute，相对于 small-box (relative) 定位        ║
        ║     bigImg 是 absolute，相对于 big-box (relative) 定位        ║
        ║     big-box 设置 overflow: hidden 裁剪超出的部分              ║
        ║                                                              ║
        ║  2. 鼠标事件                                                 ║
        ║     mouseenter → 显示遮罩层和大图框                           ║
        ║     mouseleave → 隐藏遮罩层和大图框                           ║
        ║     mousemove  → 计算位置、移动遮罩层、移动大图               ║
        ║                                                              ║
        ║  3. 核心数学：比例映射                                        ║
        ║     (遮罩层位置 / 遮罩层最大移动距离) × 大图最大移动距离      ║
        ║     大图移动方向 = 遮罩层移动方向的相反方向（加负号）          ║
        ╚══════════════════════════════════════════════════════════════╝
        */
    </script>
</body>
</html>
