<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正则表达式语法</title>
</head>
<body>
    

    <script>
    const str = 'hello world'
    const reg = /hello/
    console.log(reg.test(str))//true
    console.log(reg.exec(str))//hello
    
    </script>
</body>
</html>
