<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>间隔函数</title>
</head>
<body>

    <script>
        setInterval(function(){
            document.write('hello world' + '<br>')
        }, 1000);
        // 间隔函数： setInterval() 方法用于指定 setInterval() 方法在指定的时间间隔（以毫秒为单位）调用函数或计算表达式。
        // 注意： setInterval() 方法会继续调用函数或计算表达式，直到页面被关闭或清除定时器。
        // 清除定时器： clearInterval() 方法用于清除 setInterval() 方法设置的定时器。
        // 注意： clearInterval() 方法会清除所有 setInterval() 方法设置的定时器，包括当前正在运行的定时器。
        // 语法： clearInterval(timerId);
        // 参数： timerId 是 setInterval() 方法返回的定时器 ID。
        // 返回值： 无。
        // 示例：
        // let timerId = setInterval(function(){
        //     document.write('hello world' + '<br>')
        // }, 1000);
        // clearInterval(timerId);

    </script>
    
</body>
</html>
