<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrapper {
            width: 840px;
            height: 420px;
            margin: 100px auto;
            background: url(../img/落日黄昏时.jpg) no-repeat center / cover;
            padding: 100px 250px;
        }
        .wrapper strong{
            font-size: 30px;
            color: #fff;
        }
        .wrapper h1{
            font-size: 20px;
            color: #fff;
        }
        .wrapper h3{
            font-size: 16px;
            color: #fff;
        }
        .wrapper h5{
            font-size: 14px;
            color: #fff;
        }
        .wrapper span{
            color: #fff;
        }
    </style>

</head>

<body>
    <div class="wrapper">
        <strong>年会抽奖</strong>
        <h1>一等奖:<span id="one">???</span></h1>
        <h3>二等奖:<span id="two">???</span></h3>
        <h5>三等奖:<span id="three">???</span></h5>
    </div>

    <script>
        let arr = ['张三','李四','王五','赵六','王二','麻子'];
        // 一等奖
        const random1 = Math.floor(Math.random() * arr.length);
        const one = document.querySelector('#one');
        one.innerHTML = `${arr[random1]}`;
        arr.splice(random1, 1);
        console.log(arr);
        // 二等奖
        const random2 = Math.floor(Math.random() * arr.length);
        const two = document.querySelector('#two');
        two.innerHTML = `${arr[random2]}`;
        arr.splice(random2, 1);
        console.log(arr);
        // 三等奖
        const random3 = Math.floor(Math.random() * arr.length);
        const three = document.querySelector('#three');
        three.innerHTML = `${arr[random3]}`;
        arr.splice(random3, 1);
        console.log(arr);
    </script>
</body>

</html>
