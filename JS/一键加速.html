<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键加速 | Time Warp</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #16213e 100%);
            font-family: 'Noto Sans SC', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景网格效果 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(0, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 60px rgba(0, 255, 255, 0.1),
                inset 0 0 60px rgba(0, 255, 255, 0.02);
        }

        /* 标题 */
        .title {
            font-size: 18px;
            color: rgba(0, 255, 255, 0.6);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* 时间显示 */
        .time-display {
            font-family: 'Orbitron', monospace;
            font-size: 72px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
            position: relative;
            letter-spacing: 4px;
        }

        /* 日期显示 */
        .date-display {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 50px;
            letter-spacing: 2px;
        }

        /* 加速按钮 */
        .warp-button {
            position: relative;
            padding: 24px 60px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2cbf 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 4px;
            text-transform: uppercase;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 
                0 10px 40px rgba(0, 212, 255, 0.4),
                0 0 0 1px rgba(0, 212, 255, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .warp-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 
                0 15px 50px rgba(0, 212, 255, 0.5),
                0 0 0 1px rgba(0, 212, 255, 0.3),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .warp-button:active {
            transform: translateY(0) scale(0.98);
        }

        /* 按钮光效 */
        .warp-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: left 0.5s ease;
        }

        .warp-button:hover::before {
            left: 100%;
        }

        /* 加速中的按钮状态 */
        .warp-button.warping {
            animation: pulse 0.3s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 10px 40px rgba(255, 0, 255, 0.6), 0 0 60px rgba(255, 0, 255, 0.4);
            }
            50% { 
                box-shadow: 0 10px 60px rgba(255, 0, 255, 0.8), 0 0 100px rgba(255, 0, 255, 0.6);
            }
        }

        /* 速度线效果 */
        .speed-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }

        .speed-lines.active {
            animation: speedLines 1s ease-out;
        }

        @keyframes speedLines {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { opacity: 0; }
        }

        .speed-line {
            position: absolute;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, #00ffff, transparent);
            opacity: 0;
        }

        .speed-lines.active .speed-line {
            animation: moveLine 0.5s linear infinite;
        }

        @keyframes moveLine {
            0% {
                transform: translateY(-100vh);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* 时间数字动画效果 */
        .time-display.animating {
            animation: timeGlitch 0.1s ease-in-out infinite;
        }

        @keyframes timeGlitch {
            0%, 100% {
                transform: translateX(0);
                filter: hue-rotate(0deg);
            }
            25% {
                transform: translateX(-2px);
                filter: hue-rotate(90deg);
            }
            75% {
                transform: translateX(2px);
                filter: hue-rotate(-90deg);
            }
        }

        /* 粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            opacity: 0;
        }

        .particle.active {
            animation: particleExplode 5s ease-out forwards;
        }

        @keyframes particleExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        /* 底部提示 */
        .hint {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        /* ==================== 响应式设计 ==================== */

        /* 平板设备适配 (最大宽度 1024px) */
        @media screen and (max-width: 1024px) {
            .container {
                padding: 50px 35px;
                margin: 20px;
            }

            .time-display {
                font-size: 56px;
                letter-spacing: 3px;
            }

            .date-display {
                font-size: 18px;
            }

            .warp-button {
                padding: 20px 50px;
                font-size: 18px;
            }

            .title {
                font-size: 16px;
                letter-spacing: 6px;
            }
        }

        /* 手机横屏适配 (最大宽度 768px) */
        @media screen and (max-width: 768px) {
            .container {
                padding: 40px 30px;
                margin: 15px;
                border-radius: 20px;
            }

            .time-display {
                font-size: 42px;
                letter-spacing: 2px;
            }

            .date-display {
                font-size: 16px;
                margin-bottom: 40px;
            }

            .warp-button {
                padding: 18px 45px;
                font-size: 16px;
                letter-spacing: 3px;
            }

            .title {
                font-size: 14px;
                letter-spacing: 4px;
                margin-bottom: 25px;
            }

            .hint {
                font-size: 12px;
                bottom: 30px;
            }

            /* 背景网格更小 */
            body::before {
                background-size: 30px 30px;
            }
        }

        /* 手机竖屏适配 (最大宽度 480px) */
        @media screen and (max-width: 480px) {
            .container {
                padding: 35px 25px;
                margin: 10px;
                border-radius: 16px;
                width: calc(100% - 20px);
                max-width: 360px;
            }

            .time-display {
                font-size: 36px;
                letter-spacing: 1px;
            }

            .date-display {
                font-size: 14px;
                margin-bottom: 35px;
                letter-spacing: 1px;
            }

            .warp-button {
                padding: 16px 40px;
                font-size: 15px;
                letter-spacing: 2px;
                width: 100%;
                max-width: 280px;
            }

            .title {
                font-size: 13px;
                letter-spacing: 3px;
                margin-bottom: 20px;
            }

            .hint {
                font-size: 11px;
                bottom: 20px;
                padding: 0 20px;
                text-align: center;
            }
        }

        /* 超小屏幕适配 (最大宽度 360px) */
        @media screen and (max-width: 360px) {
            .container {
                padding: 30px 20px;
            }

            .time-display {
                font-size: 32px;
            }

            .date-display {
                font-size: 13px;
            }

            .warp-button {
                padding: 14px 35px;
                font-size: 14px;
            }

            .title {
                font-size: 12px;
                letter-spacing: 2px;
            }
        }

        /* 横屏模式优化 */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .container {
                padding: 25px 30px;
            }

            .time-display {
                font-size: 36px;
                margin-bottom: 5px;
            }

            .date-display {
                margin-bottom: 25px;
                font-size: 14px;
            }

            .title {
                margin-bottom: 15px;
            }

            .warp-button {
                padding: 14px 40px;
                font-size: 15px;
            }

            .hint {
                position: relative;
                bottom: auto;
                margin-top: 20px;
            }
        }

        /* 高分辨率屏幕优化 */
        @media screen and (min-width: 1920px) {
            .container {
                padding: 80px 60px;
                max-width: 800px;
            }

            .time-display {
                font-size: 96px;
            }

            .date-display {
                font-size: 24px;
            }

            .warp-button {
                padding: 28px 70px;
                font-size: 22px;
            }

            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 速度线容器 -->
    <div class="speed-lines" id="speedLines"></div>
    
    <!-- 粒子容器 -->
    <div class="particles" id="particles"></div>

    <!-- 主容器 -->
    <div class="container">
        <div class="title">当前时间</div>
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <div class="date-display" id="dateDisplay">2024年1月1日 星期一</div>
        <button class="warp-button" id="warpButton" onclick="warpTime()">
            ⚡ 时间加速
        </button>
    </div>

    <div class="hint">点击按钮将时间快进 24 小时</div>

    <script>
        let currentTime = new Date();
        let isWarping = false;

        // 初始化速度线
        function initSpeedLines() {
            const container = document.getElementById('speedLines');
            for (let i = 0; i < 20; i++) {
                const line = document.createElement('div');
                line.className = 'speed-line';
                line.style.left = Math.random() * 100 + '%';
                line.style.animationDelay = Math.random() * 0.5 + 's';
                line.style.height = (50 + Math.random() * 100) + 'px';
                container.appendChild(line);
            }
        }

        // 创建粒子爆炸效果
        function createParticles(x, y) {
            const container = document.getElementById('particles');
            container.innerHTML = '';
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                const angle = (Math.PI * 2 * i) / 30;
                const distance = 100 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                particle.style.background = i % 2 === 0 ? '#00ffff' : '#ff00ff';
                
                container.appendChild(particle);
                
                setTimeout(() => particle.classList.add('active'), 10);
            }
        }

        // 格式化时间
        function formatTime(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        // 格式化日期
        function formatDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekday = weekdays[date.getDay()];
            return `${year}年${month}月${day}日 ${weekday}`;
        }

        // 更新时间显示
        function updateDisplay() {
            document.getElementById('timeDisplay').textContent = formatTime(currentTime);
            document.getElementById('dateDisplay').textContent = formatDate(currentTime);
        }

        // 时间快进动画
        function animateTimeWarp() {
            const timeDisplay = document.getElementById('timeDisplay');
            const startTime = currentTime.getTime();
            const endTime = startTime + (24 * 60 * 60 * 1000); // 24小时后的时间
            const duration = 1500; // 动画持续时间
            const startTimestamp = Date.now();

            timeDisplay.classList.add('animating');

            function step() {
                const elapsed = Date.now() - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);
                
                // 使用缓动函数
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentTimestamp = startTime + (endTime - startTime) * easeProgress;
                currentTime = new Date(currentTimestamp);
                
                updateDisplay();

                if (progress < 1) {
                    requestAnimationFrame(step);
                } else {
                    timeDisplay.classList.remove('animating');
                    isWarping = false;
                    document.getElementById('warpButton').classList.remove('warping');
                    document.getElementById('warpButton').textContent = '⚡ 时间加速';
                    document.getElementById('speedLines').classList.remove('active');
                }
            }

            requestAnimationFrame(step);
        }

        // 时间加速功能
        function warpTime() {
            if (isWarping) return;
            
            isWarping = true;
            const button = document.getElementById('warpButton');
            
            // 获取按钮位置用于粒子效果
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // 激活特效
            button.classList.add('warping');
            button.textContent = '加速中...';
            document.getElementById('speedLines').classList.add('active');
            createParticles(centerX, centerY);
            
            // 开始时间动画
            animateTimeWarp();
        }

        // 初始化
        initSpeedLines();
        updateDisplay();
        
        // 每秒更新时间（如果没有在加速中）
        setInterval(() => {
            if (!isWarping) {
                currentTime = new Date();
                updateDisplay();
            }
        }, 1000);
    </script>
</body>
</html>
