<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>构造函数</title>
</head>
<body>
    <script>
        // 构造函数
        //公共的属性写到构造函数中
        function Person(name, age) {
            this.name = name;
            this.age = age;
            // this.sing = function() {
            //     console.log('我会唱歌');
            // }
        }
        // 原型对象
        // 公共的方法写到原型对象中
        Person.prototype.sing = function() {
            console.log('我会唱歌');
        }


        // 实例化对象
        const p1 = new Person('张三', 18);
        console.log(p1);
        p1.sing();
        // 实例化对象2
        const p2 = new Person('李四', 20);
        console.log(p2);
        p2.sing();
        // 检查是否是实例化对象
        console.log(p1===p2);//false

        //原型对象
        console.log(Person.prototype);
        // 实例化对象的原型
        console.log(p1.sing===p2.sing);//true
    </script>
</body>
</html>
