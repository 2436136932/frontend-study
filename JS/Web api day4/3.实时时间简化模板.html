<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时显示时间</title>
    <style>
        div {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            font-size: 30px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div></div>
    <script>
        const div = document.querySelector('div');
        // 实例化日期对象
        const date = new Date();
        div.innerHTML = date.toLocaleString();// 显示时间
        setInterval(function () {
            // 实例化日期对象
            const date = new Date();
            div.innerHTML = date.toLocaleString();// 显示时间
        }, 1000);
    </script>


</body>

</html>
