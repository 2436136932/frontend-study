<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时显示时间</title>
    <style>
        div {
            display: block;
            height: 50px;
            width: 600px;
            font-size: 30px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div></div>
    <script>
        const div = document.querySelector('div');
        let myTime = function () {
            // 实例化日期对象
            const date = new Date();
            let h = date.getHours();
            let m = date.getMinutes();
            let s = date.getSeconds();
            // 补0
            h = h < 10 ? '0' + h : h;
            m = m < 10 ? '0' + m : m;
            s = s < 10 ? '0' + s : s;
            div.innerHTML = `现在是${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日 ${h}:${m}:${s}`;
        }
        // 调用函数
        myTime();
        // 调用函数
        setInterval(function () {
            myTime();
        }, 1000);
    </script>


</body>

</html>
