<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转换为字符串</title>
</head>
<body>
    <script>
        const num = 12345;
        // 转换为字符串
        // 1. 用 + 运算符
        console.log(num + '');
        // 2. 用 toString 方法
        console.log(num.toString());
        // 3. 用 String 方法
        console.log(String(num));
    </script>
</body>
</html>
