<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪数组转为真数组</title>
</head>
<body>
    <ul>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>
    <script>
        const lis = document.querySelectorAll('li');
        // console.log(lis);//NodeList对象，不是数组
        const arr = Array.from(lis);
        arr.pop();
        console.log(arr);//数组
    </script>
</body>
</html>
