<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string常用方法</title>
</head>

<body>
    <script>
        // 1.split 方法：将字符串分割成数组，和join相反
        const str = "hello,world";
        // 使用 split 方法，以逗号为分隔符，将字符串分割成数组
        const arr = str.split(',');
        console.log(arr);
        console.log(arr[0]);
        console.log(arr[1]);
        console.log('------------------------------');

        //2.字符串的截取方法：substring(start, end)
        // start：开始截取的索引（包含）
        // end：结束截取的索引（不包含）
        // 截取从索引0开始，到索引5结束的字符串
        console.log(str.substring(2, 7));
        console.log('------------------------------');

        //3.startsWith 方法：判断字符串是否以指定的前缀开头
        console.log(str.startsWith('hello'));//true
        console.log(str.startsWith('world'));//false
        console.log(str.startsWith('world', 6));//true
        console.log('------------------------------');

        //4.endsWith 方法：判断字符串是否以指定的后缀结尾
        console.log(str.endsWith('world'));//true
        console.log(str.endsWith('hello'));//false
        console.log(str.endsWith('o,', 6));//true
        console.log('------------------------------');

        //5.includes 方法：判断字符串是否包含指定的子字符串
        console.log(str.includes('hello'));//true
        console.log(str.includes('world'));//true
        console.log(str.includes(',w', 5));//true
        console.log('------------------------------');
    </script>
</body>

</html>
