<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>split和join的运用</title>
</head>
<body>
    <div class="gift"></div>
    <script>
        const gift='50g的茶叶,清洗球,碗'
        document.querySelector('.gift').innerHTML = gift.split(',').map(item=>`<div>【赠品】${item}</div>`).join('')

    </script>
</body>
</html>
