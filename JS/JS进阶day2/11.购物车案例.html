<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .cart-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .item .name {
            flex: 1;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }

        .item .tag {
            display: block;
            background-color: #f39394;
            color: #fff;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 2px 0;
            width: fit-content;
        }

        .item .spec {
            width: 150px;
            font-size: 12px;
            color: #999;
            text-align: center;
        }

        .item .price {
            width: 100px;
            font-size: 14px;
            color: #333;
            text-align: center;
        }

        .item .count {
            width: 80px;
            font-size: 14px;
            color: #999;
            text-align: center;
        }

        .item .total {
            width: 100px;
            font-size: 14px;
            color: #c00;
            text-align: right;
            font-weight: bold;
        }

        .cart-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
            margin-top: 20px;
        }

        .total-label {
            font-size: 14px;
            color: #333;
            margin-right: 10px;
        }

        .total-price {
            font-size: 18px;
            color: #c00;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="cart-container">
        <!-- 商品列表 -->
        <div class="cart-list"></div>

        <!-- 合计 -->
        <div class="cart-footer">
            <span class="total-label">合计：</span>
            <span class="total-price">¥0.00</span>
        </div>
    </div>

    <script>
        // 商品数据数组
        const goodsList = [
            {
                id: '4001646',
                name: '称心如意手摇咖啡磨豆机咖啡豆研磨机',
                price: 289.90,
                picture: 'https://picsum.photos/seed/coffee1/80/80',
                count: 2,
                spec: { color: '白色' },
                gift: '50g咖啡豆,清洁刷,咖啡杯'
            },
            {
                id: '4001647',
                name: '竹制干泡茶盘正方形沥水茶台品茶盘',
                price: 109.80,
                picture: 'https://picsum.photos/seed/tea2/80/80',
                count: 3,
                spec: { size: '40cm*40cm', color: '黑色' },
                gift: '茶巾,茶夹'
            },
            {
                id: '4001648',
                name: '古法温酒汝瓷酒具套装白酒杯莲花温酒器',
                price: 488.00,
                picture: 'https://picsum.photos/seed/wine3/80/80',
                count: 1,
                spec: { size: '一大四小', color: '青色' },

            },
            {
                id: '4001649',
                name: '大师监制龙泉青瓷茶叶罐',
                price: 99,
                picture: 'https://picsum.photos/seed/jar4/80/80',
                count: 1,
                spec: { size: '小号', color: '紫色' },

            }
        ];

        const cartList = document.querySelector('.cart-list');
        cartList.innerHTML = goodsList.map(item => {
            const { size, color, gift, count, price, picture, name, spec } = item;
            const text = Object.values(spec).join('/');
            const str = gift ? gift.split(',').map(item => `<br><span class="tag">【赠品】${item}</span></br>`).join('') : ''
            // 常见写法
            // gift ? gift.split(',') : ''
            // gift && gift.split(',')      // && 写法，效果相同
            // gift?.split(',')             // 可选链写法（ES2020）
            return `
            <div class="item">
                <img src="${picture}" alt="${name}">
                    <p class="name">${name} ${str}</p>
                    <p class="spec">${text}</p>
                    <p class="price">¥${price.toFixed(2)}</p>
                    <p class="count">${count}</p>
                    <p class="total">¥${(price * 100 * count / 100).toFixed(2)}</p>
            </div>
            `
        }).join('')

        // const totalPrice = document.querySelector('.total-price');
        // let total = 0;
        // goodsList.forEach(item => {
        //     total += item.price * 100 * item.count / 100;
        // });
        // totalPrice.textContent = `¥${total.toFixed(2)}`;
        const totalPrice = document.querySelector('.total-price');
        const total = goodsList.reduce((sum, item) => sum + item.price * 100 * item.count / 100, 0);
        totalPrice.textContent = `¥${total.toFixed(2)}`;

    </script>
</body>

</html>
