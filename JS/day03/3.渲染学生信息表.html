<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渲染学生信息表</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h1{
            text-align: center;
        }
        table{
            margin: 0 auto;
            border-collapse: collapse;
            cursor: pointer;
        }
        th,td{
            text-align: center;
            width: 100px;
            height: 40px;
            border: 1px solid black;
        }
        tr{
            transition: all 0.3s;
        }
        tr:nth-child(2n-1){
            background-color: #cecdcd;
        }
        tr:nth-child(2n){
            background-color: #a2a2a2;
        }
        tr:nth-child(1){
            background-color: #6f6f6f;
        }
        tr:not(:nth-child(1)):hover{
            background-color: #fff;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            /* z-index: 1; */
            /* position: relative; */
        }
    </style>
</head>
<body>
    <h1>学生信息表</h1>
    <table>
        <tr>
            <th>序号</th>
            <th>姓名</th>
            <th>年龄</th>
            <th>性别</th>
        </tr>
        
        <script>
            // 1.遍历对象
            let students = [
                {
                    name:'蔡徐坤',
                    age:28,
                    sex:'男',
                },
                {
                    name:'王鑫',
                    age:29,
                    sex:'男',
                },
                {
                    name:'翟文康',
                    age:21,
                    sex:'男',
                },
                {
                    name:'张三',
                    age:29,
                    sex:'男',
                }
                ,
                {
                    name:'李四',
                    age:29,
                    sex:'男',
                }
            ]
            for(let i=0;i<students.length;i++){
                document.write(`
                <tr>
                    <td>${i+1}</td>
                    <td>${students[i].name}</td>
                    <td>${students[i].age}</td>
                    <td>${students[i].sex}</td>
                </tr>
                `);
            }


        </script>
    </table>

    
</body>
</html>
