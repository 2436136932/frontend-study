        function getRandomColor(N,M) {
            return Math.floor(Math.random() * (M - N + 1)) + N
        }
        alert(`请输入两个数字N和M，N<M，M为最大值，N为最小值，我来随机生成一个数字，这个数字在N和M之间`)
        let N = Number(prompt(`请输入N`))
        let M = Number(prompt(`请输入M`))
        console.log(getRandomColor(N,M))
    </script>
