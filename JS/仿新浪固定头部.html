<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仿新浪固定头部</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .header {
        position: fixed;
        top: -80px;
        left: 0;
        width: 100%;    
        height: 80px;
        background-color: skyblue;
        z-index: 999;
        transition: top 0.5s ease;
    }
    .main {
        position: relative;
        width: 100%;    
        height: 2000px;
        background-color: pink;
    }
    .main-content {
        position: absolute;
        top: 400px;
        left: 400px;
        width: 200px;    
        height: 200px;
        background-color: rgb(252, 196, 124);
    }
    .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;    
        height: px;
        background-color: #fff;
    }
    .line {
        position: absolute;
        bottom: 2px;
        left: 0;
        width: 100%;    
        height: 5px;
        z-index: 999;
        background: linear-gradient(90deg, #a1fa4e, #a5ff7b ,#dbf8cd);
        animation: move 1s linear forwards;
        /* 滚动时间线 */
        animation-timeline: scroll();
        /* animation-delay: 0.5s; */
    }
    @keyframes move {
        0% {
            transform: translateX(-100%);
        }
        100% {
            transform: translateX(0);
        }
    }
</style>



<body>
    <header>
        <div class="header">
            头部导航
        </div>
    </header>
    <main>
        <div class="main">
            主体内容
            <div class="main-content">
                主体内容区域
            </div>
        </div>
    </main>
    <footer>
        <div class="footer">
            <div class="line"></div>
        </div>
    </footer>

    <script>
        const header = document.querySelector('.header');
        const mainContent = document.querySelector('.main-content');
        window.addEventListener('scroll', function () {
            const n = document.documentElement.scrollTop;
            if (n >= mainContent.offsetTop) {
                header.style.top = '0';
            } else {
                header.style.top = '-80px';
            }
        })
    </script>
</body>

</html>
