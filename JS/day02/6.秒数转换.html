<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秒数转换</title>
</head>
<body>
    

    <script>
        function time(time){
            let h = parseInt(time/60/60%24)
            let m = parseInt(time/60%60)
            let s = parseInt(time%60)
            h = h < 10 ? `0` + h : h
            m = m < 10 ? `0` + m : m
            s = s < 10 ? `0` + s : s
            return `转换完为：${h}时${m}分${s}秒`
        }
        let t = prompt(`请输入一个秒数`)
        document.write(time(t))
    </script>
</body>
</html>
