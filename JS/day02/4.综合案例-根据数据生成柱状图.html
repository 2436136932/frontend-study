<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>根据数据生成柱状图</title>
    <style>
        .chart{
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            width: 800px;
            height: 400px;
            margin: 100px auto;
            /* background-color: pink; */
            border-left: 2px solid pink;
            border-bottom: 2px solid pink;
        }
        .box{
            position: relative;
            display: flex;
            flex-direction: column;
            width: 50px;
            background-color: pink;
        }
        .box span{
            display: block;
            margin-top: -30px;
            font-size: 14px;
            text-align: center;
        }
        .box h4{
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            text-align: center;
            font-size: 16px;
            margin: 0;
        }
        .box:nth-child(1){
            background-color: rgb(243, 172, 216);
        }
        .box:nth-child(2){
            background-color: rgb(243, 243, 172);
        }
        .box:nth-child(3){
            background-color: rgb(172, 243, 243);
        }
        .box:nth-child(4){
            background-color: rgb(243, 172, 172);
        }
    </style>
</head>
<body>
    
    
    <script>
        let arr = []
        for (let i = 1;i <= 4;i++){
            arr.push(prompt(`请输入第${i}季度的销售量`))
        }
        console.log(arr)
        document.write(`<div class="chart">`)
            for(let i = 0;i < arr.length;i++){
                document.write(`<div class="box" style="height:${arr[i]}px;">`)
                document.write(`<span>${arr[i]}</span>`)
                document.write(`<h4>第${i+1}季度</h4>`)
                document.write(`</div>`)
            }
        document.write(`</div>`)
    </script>
</body>
</html>
