<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环境对象</title>
</head>
<body>
    <button id="btn">点击我</button>
    <script>
        // 环境对象：window对象
        function fn() {
            console.log(this);
        }
        fn();
        // 环境对象：btn对象
        const btn = document.getElementById('btn');
        btn.addEventListener('click', function () {
            console.log(this);
        })
    </script>
</body>
</html>
