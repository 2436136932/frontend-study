<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击关闭</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box {
            position: relative;
            width: 600px;
            height: 300px;
            background: pink;
            margin: 100px auto;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
        }

        .close button {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="close">
            <button>❌️</button>
        </div>
    </div>
    <script>
        const box = document.querySelector('.box');
        const close = document.querySelector('.close');
        close.addEventListener('click', function () {
            box.style.display = 'none';
        })
    </script>

</body>

</html>
