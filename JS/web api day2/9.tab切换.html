<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tab切换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .tab {
            width: 600px;
            margin: 50px auto;
        }

        .tab-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-nav h3 {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            padding: 10px 0;
        }

        .tab-nav ul {
            display: flex;
            list-style: none;
        }

        .tab-nav ul li {
            margin-left: 20px;
        }

        .tab-nav ul li a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            padding: 10px 5px;
            display: block;
        }

        .tab-nav ul li a.active {
            color: #ff6700;
            border-bottom: 2px solid #ff6700;
        }

        .tab-content {
            padding: 20px 0;
        }

        .tab-content .item {
            display: none;
        }

        .tab-content .item.active {
            display: block;
        }

        .tab-content .item img {
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="tab">
        <div class="tab-nav">
            <h3>每日特价</h3>
            <ul>
                <li><a class="active" href="javascript:;">精选</a></li>
                <li><a href="javascript:;">美食</a></li>
                <li><a href="javascript:;">百货</a></li>
                <li><a href="javascript:;">个护</a></li>
                <li><a href="javascript:;">预告</a></li>
            </ul>
        </div>
        <div class="tab-content">
            <div class="item active"><img src="../img/桃花依旧笑春风.jpg" alt="" /></div>
            <div class="item"><img src="../img/万条垂下绿丝绦.jpg" alt="" /></div>
            <div class="item"><img src="../img/夏日的浪漫.jpg" alt="" /></div>
            <div class="item"><img src="../img/心脏的温度.jpg" alt="" /></div>
            <div class="item"><img src="../img/是风吹.jpg" alt="" /></div>
        </div>
    </div>

    <script>
        // 获取所有导航链接
        const links = document.querySelectorAll('.tab-nav ul li a')
        // 获取所有内容项
        const items = document.querySelectorAll('.tab-content .item')

        // 遍历所有链接，添加鼠标悬停事件
        for (let i = 0; i < links.length; i++) {
            links[i].addEventListener('mouseenter', function () {
                // 移除所有链接的 active 类
                document.querySelector('.tab-nav .active').classList.remove('active')
                //给当前点击的链接添加 active 类
                this.classList.add('active')
                // 移除所有内容项的 active 类
                document.querySelector('.tab-content .active').classList.remove('active')
                // 给对应的内容项添加 active 类
                items[i].classList.add('active')
            })
        }
    </script>
</body>

</html>
