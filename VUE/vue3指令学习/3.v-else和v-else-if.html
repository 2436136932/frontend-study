<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-else和v-else-if</title>
</head>
<body>
    <div id="app">
        <p v-if="gender === 1">性别：男</p>
        <p v-else>性别：女</p>
        <hr>
        <p v-if="score >= 90&&score <= 100">A：90~100分</p>
        <p v-else-if="score >= 80&&score < 90">B：80~89分</p>
        <p v-else-if="score >= 70&&score < 80">C：70~79分</p>
        <p v-else-if="score >= 60&&score < 70">D：60~69分</p>
        <p v-else-if="score < 60&&score >= 0">E：60分以下</p>
        <p v-else>输入错误</p>

    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    gender: 2,
                    score: 100
                }
            }
        })
        app.mount('#app')
    </script>
</body>
</html>
