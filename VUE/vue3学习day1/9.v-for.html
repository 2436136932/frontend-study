<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-for指令</title>
</head>

<body>
    <div id="app">
        <!-- 完整写法 -->
        <ul>
            <li v-for="(item, index) in list">{{ item.name }} {{ item.num }}---{{ index }}</li>
        </ul>
        <!-- 简单写法 -->
        <ul>
            <li v-for="item in list">{{ item }}</li>
        </ul>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue
        createApp({
            data() {
                return {
                    list: [
                        {
                            name: '西瓜',
                            num: 100
                        },
                        {
                            name: '苹果',
                            num: 20
                        },
                        {
                            name: '香蕉',
                            num: 30
                        },
                        {
                            name: '葡萄',
                            num: 40
                        },
                        {
                            name: '桃子',
                            num: 50
                        }
                    ],
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
