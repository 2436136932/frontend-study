<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初学指令</title>
</head>

<body>
    <div id="app">
        <div v-html="message"></div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    message: `
                    <a href="https://www.baidu.com">百度</a>
                    `
                }
            }
        })
        app.mount('#app')
    </script>
</body>

</html>
