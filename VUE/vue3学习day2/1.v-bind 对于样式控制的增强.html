<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v-bind 对于样式控制的增强</title>
</head>
<style>
    .box {
        width: 100px;
        height: 100px;
        border: 1px solid red;
    }

    .pink {
        background-color: pink;
    }

    .big {
        width: 400px;
        height: 400px;
    }
</style>

<body>
    <div id="app">
        <div class="box" :class="{'pink': true}"></div>
        <div class="box" :class="['big', 'pink']"></div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {

                }
            }
        })
        app.mount('#app')
    </script>
</body>

</html>
