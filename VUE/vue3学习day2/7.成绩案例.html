<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 20px;
            color: #222;
            background-color: #fff;
        }

        .score-wrap {
            display: flex;
            align-items: flex-start;
            gap: 40px;
        }

        .score-table {
            width: 760px;
            border-collapse: collapse;
            text-align: center;
            font-size: 16px;
        }

        .score-table th,
        .score-table td {
            height: 46px;
            border: 1px solid #ddd;
        }

        .score-table th {
            background-color: #f5f5f5;
            font-weight: 700;
        }

        .score-table .danger {
            color: #e53935;
            font-weight: 700;
        }

        .score-table a {
            color: #6b4c8b;
            text-decoration: underline;
            cursor: pointer;
        }

        .score-table tfoot td {
            height: 46px;
            font-size: 16px;
            background-color: #fff;
        }

        .score-table tfoot span {
            margin: 0 20px;
        }

        .score-form {
            width: 280px;
            padding-top: 20px;
        }

        .form-item {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
        }

        .form-item label {
            width: 48px;
            font-size: 16px;
        }

        .form-item input {
            flex: 1;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #dcdcdc;
            outline: none;
            font-size: 15px;
        }

        .form-item input:focus {
            border-color: #0b79a6;
        }

        .add-btn {
            margin-left: 48px;
            width: 52px;
            height: 30px;
            border: none;
            border-radius: 5px;
            background-color: #0b78a5;
            color: #fff;
            cursor: pointer;
        }

        .add-btn:hover {
            background-color: #096489;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="score-wrap">
            <table class="score-table">
                <thead>
                    <tr>
                        <th>编号</th>
                        <th>科目</th>
                        <th>成绩</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(item, index) in scores" :key="item.id">
                        <td>{{ index + 1 }}</td>
                        <td>{{ item.subject }}</td>
                        <td :class="{'danger': item.score < 60}">{{ item.score }}</td>
                        <td><a @click="removeScore(item.id)">删除</a></td>
                    </tr>

                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="4">
                            <span>总分：{{ totalScore }}</span>
                            <span>平均分：{{ averageScore }}</span>
                        </td>
                    </tr>
                </tfoot>
            </table>

            <div class="score-form">
                <div class="form-item">
                    <label>科目：</label>
                    <input type="text" v-model="subject" placeholder="请输入科目">
                </div>
                <div class="form-item">
                    <label>分数：</label>
                    <input type="number" v-model="score" min="0"
                        max="100" @keyup.enter="addScore" placeholder="请输入分数">
                </div>
                <button class="add-btn" @click="addScore">添加</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    scores: [],
                    subject: '',
                    score: ''
                }
            },
            methods: {
                removeScore(id) {
                    this.scores = this.scores.filter(item => item.id !== id)
                },
                addScore() {
                    if (this.score === '' || this.score === null) {
                        alert('请输入分数')
                        return
                    }
                    if (this.score < 0 || this.score > 100) {
                        alert('分数必须在 0-100 之间')
                        return
                    }
                    this.scores.push({
                        id: this.scores.length + 1,
                        subject: this.subject,
                        score: Number(this.score)
                    })
                    this.clearForm()
                },
                clearForm() {
                    this.subject = ''
                    this.score = ''
                },

            },
            computed: {
                totalScore() {
                    return this.scores.reduce((acc, cur) => acc + cur.score, 0).toFixed(2)
                },
                averageScore() {
                    return this.scores.length > 0 ? (this.totalScore / this.scores.length).toFixed(2) : 0
                }
            }
        })
        app.mount('#app')
    </script>
</body>

</html>
