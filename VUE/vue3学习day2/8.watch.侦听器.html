<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>watch 侦听器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px;
            color: #222;
            background-color: #f5f5f5;
        }

        .container {
            width: 520px;
            background: #fff;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .item {
            margin-bottom: 20px;
        }

        .item label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .item input {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .item input:focus {
            border-color: #0b79a6;
        }

        .log-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8f8f8;
            border-radius: 8px;
            min-height: 100px;
        }

        .log-box p {
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <h2>Watch 侦听器示例</h2>

            <div class="item">
                <label>普通数据：</label>
                <input type="text" v-model="words" placeholder="输入内容观察变化">
            </div>

            <div class="item">
                <label>对象属性：</label>
                <input type="text" v-model="obj.words" placeholder="输入内容观察变化">
            </div>

            <div class="log-box">
                <p>控制台输出：</p>
                <p>F12 打开控制台查看 watch 触发日志</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    words: '',
                    obj: {
                        words: ''
                    }
                }
            },
            watch: {
                // 监听普通数据
                words(newValue, oldValue) {
                    console.log('words 变化了：', newValue, oldValue)
                },
                // 监听对象属性（完整写法）
                'obj.words': {
                    handler(newValue, oldValue) {
                        console.log('obj.words 变化了：', newValue, oldValue)
                    },
                    deep: true//开启深度监听
                }
            }
        })
        app.mount('#app')
    </script>
</body>

</html>
