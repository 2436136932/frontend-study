<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算属性完整写法</title>
    <style>
        span {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div id="app">
        <input type="text" v-model="firstName" placeholder="请输入姓">
        <input type="text" v-model="lastName" placeholder="请输入名">
        <br>
        <button @click="showFullName">输出全名</button>
        <span>全名:{{ resultName }}</span>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    firstName: '',
                    lastName: '',
                    resultName: ''
                }
            },
            computed: {
                fullName: {
                    get() {
                        return this.firstName + this.lastName
                    },
                    set(value) {
                        this.firstName = value.slice(0, 1)
                        this.lastName = value.slice(1)
                    }
                }
            },
            methods: {
                showFullName() {
                    this.resultName = this.fullName
                }
            }
        })
        app.mount('#app')
    </script>
</body>
</html>
