<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进度条案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px;
            color: #333;
            background-color: #fff;
        }

        #app {
            width: 520px;
        }

        h3 {
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
        }

        .progress-box {
            width: 100%;
        }

        .progress-track {
            width: 100%;
            height: 32px;
            padding: 3px;
            background-color: #262323;
            border-radius: 18px;
            border: 1px solid #444;
            overflow: hidden;
        }

        .progress-bar {
            width: 50%;
            height: 100%;
            background-color: #3da0ff;
            border-radius: 16px;
            transition: all 0.3s ease-in-out;
        }

        .progress-text {
            margin-top: 6px;
            text-align: center;
            font-size: 22px;
            line-height: 1;
            color: #333;
        }
    </style>
</head>

<body>
    <div id="app">
        <h3>进度条案例</h3>
        <div class="progress-box">
            <div class="progress-track">
                <div class="progress-bar" :style="{ width: progress + '%' }"></div>
            </div>
            <div class="progress-text">{{ progress }}%</div>
        </div>

        <button @click="progress = 0">进度条0%</button>
        <button @click="progress = 25">进度条25%</button>
        <button @click="progress = 50">进度条50%</button>
        <button @click="progress = 75">进度条75%</button>
        <button @click="progress = 100">进度条100%</button>
        <br>
        <!-- <input type="number" v-model="progress" min="0" max="100" step="1"> -->
        <input type="number" v-model="newProgress" min="0" max="100" step="1">
        <button @click="progress = newProgress">更新进度条</button>

    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data() {
                return {
                    progress: 50,
                    newProgress: 0
                }
            }
        })
        app.mount('#app')
    </script>
</body>

</html>
